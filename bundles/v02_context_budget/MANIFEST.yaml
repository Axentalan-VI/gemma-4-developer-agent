variant: v02_context_budget
parent: v01_hygiene
hypothesis: >
  v01's 11 hygiene items, with the sampling change corrected. Run probe_c12
  (2026-10-06) produced the first real evidence from this competition's model:
  the analyzer sub-agent reached 24,577 input tokens and died on a NON-RETRYABLE
  ContextWindowExceededError. max_output_tokens is a reservation sent on every
  request, so the input ceiling is 32768 minus it. v00 leaves 24,576 on both
  agents, which is one token short of what was observed; v01 leaves 29,696 on
  the analyzer (better) but only 20,480 on the coder (worse). This bundle leaves
  28,672 on the coder and 30,720 on the analyzer, above everything observed.
topology: unchanged from v00 (root coder + read-only code_analyzer AgentTool)
ships_eval_config: false
expected_delta: >
  Unknown and deliberately not guessed. This fixes a failure that loses whole
  tasks, so the effect depends entirely on how often a trajectory exceeds the
  ceiling -- which needs the prompt-size distribution that probe_c12 was
  cancelled before producing. Measure before claiming.
measured:
  clean_n: null
  k: 0
  leaderboard: null
  evidence_from: >
    probe_c12, 2026-10-06, the first run in this project to serve a request.
    Cancelled after ~47 GPU-minutes with no output persisted; the only surviving
    artifact was log text, which is why session_runner now echoes ledger rows to
    stdout.

changes:
  - id: py-compile-after-edit
    why: >
      edit_file's whitespace-flexible tier can apply a change at the wrong
      indentation and leave a file that still parses as far as the tool is
      concerned but breaks on import. In Python that is a guaranteed zero, and
      one free tool call catches it. Highest-value single instruction here.
  - id: scratch-to-tmp-via-heredoc
    why: >
      The patch is `git add -N . && git diff`, so a leftover /workspace/repro.py
      ships. write_file rejects /tmp, so the only route is a run_command
      heredoc, which the v00 prompt never explains.
  - id: never-revert
    why: >
      The harness auto-extracts the working tree even without submit_patch, so
      an agent that concludes its fix was wrong and checks out the file
      guarantees an empty diff. v00 says nothing about this. Adds an explicit
      /tmp/best.patch save-and-restore protocol instead.
  - id: correct-patch-never-adds-a-file
    why: >
      Measured: 0 of 129 gold patches create a new file (scripts/analyze_tasks.py).
      So this is an exact rule, not a heuristic, and it can be stated flatly.
  - id: fix-search-similar-code-usage
    why: >
      v00's analyzer prompt says to use search_similar_code "for concepts the
      issue describes without naming code" -- precisely the usage that cannot
      work, because it resolves the query against stored symbol keys rather than
      embedding free text. It also returns full node source, so a broad call can
      flood a 32k context. Now: bare symbol names only, k<=3, verify by reading.
      This looks like a latent bug in the bundle ~19 teams are running.
  - id: read-file-over-sed
    why: >
      v00 offers `sed -n 'START,ENDp'` as an equal alternative to read_file, but
      run_command output truncates at 5,000 chars against read_file's 10,000, so
      sed is strictly worse for reading code.
  - id: git-grep-over-grep-r
    why: Faster in a git checkout, and ripgrep is not installed.
  - id: async-blind-graph-tools
    why: >
      Graph tools carry synchronous CALLS edges only and miss async functions
      entirely, which is most of fastapi and httpx. The prompt now says a
      missing node proves nothing, and not to pass edge_type.
  - id: budget-framing
    why: >
      Competitors report 8-10 turn workflows against a 100-call, 60-minute
      budget. v00's prompt reads as if budget were scarce. Reframed to say the
      surplus exists and belongs to verification and repair.
  - id: separate-analyzer-sampling
    why: >
      v00 shares one sampling config between coder and analyzer. The analyzer
      emits a fixed 250-word report, so 8192 output tokens is dead weight;
      3072 at temperature 0.1 suits a deterministic extraction task.
  - id: terse-issue-handling
    why: >
      Measured: rich's problem statements have a median of 146 chars against
      fastapi's 677. Identifier-extraction rules degrade badly on terse issues,
      and rich is the confirm split. The analyzer is now told what to do when an
      issue names no code, instead of inventing detail.

  - id: output-budget-as-reservation
    why: >
      MEASURED, not reasoned. Run probe_c12: input 24,577 + reserved 8,192 =
      32,769 against a 32,768 window, so the call was refused by exactly one
      token and the retry plugin classified it non-retryable. The task was lost
      outright. Both failures in that log were inside agent_tool.py, so the
      analyzer is the path that actually blows up -- it holds the three
      flood-prone tools and emits a fixed ~250-word report, making a large
      output reservation pure dead weight. Coder 12288 -> 4096 (ceiling
      28,672), analyzer 3072 -> 2048 (ceiling 30,720). The validator now
      enforces this class of error offline, so it can never cost quota again.
  - id: compaction-does-not-bound-this
    why: >
      The compaction threshold is 14,336 tokens, yet the observed prompt reached
      24,577. So compaction did not bound the analyzer's context. Either it does
      not apply to a nested AgentTool runner or it fires too late to help. Until
      that is understood, the output reservation is the only control we have,
      which is why it is set conservatively rather than tuned.

risks:
  - >
    Inherits v01's risk: this is still a longer prompt than v00, and the one
    community A/B suggests short and generic beats long and rule-laden. That A/B
    is a competitor's long lab-derived ruleset scoring 0.05 against the short
    public prompt's 0.12-0.15. The mitigation is that every rule here is about
    the harness or about measured gold-patch structure, and none is about a
    specific library -- which is what the validator's generalization lint
    enforces. If this bundle regresses, the next one tests the same items as a
    *shorter* prompt rather than abandoning them.
  - >
    4096 output tokens may truncate a very large edit_file call, which is the
    exact failure v01 raised the budget to avoid. The difference is that
    truncation wastes a turn while exceeding the window loses the task, so the
    trade is deliberately asymmetric. If traces show truncated tool calls, the
    fix is to instruct smaller edits rather than to raise the reservation.
