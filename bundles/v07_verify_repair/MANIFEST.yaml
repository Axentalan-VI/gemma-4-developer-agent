variant: v07_verify_repair
parent: v00_public_baseline
hypothesis: >
  Split the agent into an editor that cannot run anything and a verifier that
  can, so that **running the tests is structurally guaranteed to happen** rather
  than being asked for in prompt text.

  The evidence this targets is the only invariant that has held across all three
  60-minute runs: **tasks that produce a real code change still resolve 0.**
  P005 and P006 both returned 0/12 resolved; both P006 arms produced 11 of 12
  patches; v00 reached gold_hit 5/12 while resolving 0/12. So the agent finds the
  right file and the fix is still wrong. Localization (v06) and budget waste
  (v05, retired at McNemar p=1.00) have both been addressed without moving the
  outcome. Fix *quality* is what is left, and the standard mechanism for fix
  quality is: run a failing reproduction, see it fail, repair, re-run.

  v00's prompt already tells the agent to do exactly that in steps 3 and 5. It
  does not happen. Prompt text does not bind this model mid-loop -- v03's
  anti-repeat rules *raised* the re-issue rate 0.410 -> 0.485, and the harness's
  own `budget_warning` was ignored 11 consecutive times. **The tools list is the
  only thing the compiler enforces**, so the verification step is made
  structural: the editor has no shell, so it physically cannot run tests, and the
  verifier owns `run_command` outright.

topology: >
  NEW, and the first non-`LlmAgent` root this project has shipped.
  `SequentialAgent` root -> [`editor`, `verifier`].

  editor:   read_file, search_similar_code, get_code_neighbors, edit_file, get_status
  verifier: run_command, read_file, edit_file, get_status, submit_patch
            + include_contents: none

ships_eval_config: false

changes:
  - id: sequential-two-stage-root
    why: >
      THE LEVER. A `SequentialAgent` runs its sub_agents in order, so the
      verifier stage cannot be skipped the way a prompt step can.

      `LoopAgent` was considered and REJECTED on a hard mechanical finding:
      `compile_submission` is called WITHOUT `callback_registry`
      (`swegemma__agent_runner.py:334`), so it defaults to None and **no
      callbacks are available to a submission at all**. A `LoopAgent` stops only
      when a sub-agent emits an `escalate` event (`google.adk__loop_agent.py:103`),
      which needs a callback. So a LoopAgent would run **exactly**
      `max_iterations` passes with no early exit, and since the evaluated patch is
      the final state of the working tree (see below), a second pass would be free
      to overwrite a fix that already worked. We resolve ~8 of 58 tasks on the
      private set, so that is a live risk to real tasks, not a theoretical one.

  - id: no-shell-for-the-editor
    why: >
      Removing `run_command` from the editor is what reserves execution budget
      for the verifier. Budgets are **session-global** -- v03 established that a
      per-sub-agent cap is not expressible in the declarative format -- so the
      tools list is the only enforceable way to stop stage 1 consuming stage 2's
      budget in a grep/pytest loop.

      `write_file` is withheld from the editor as a direct consequence, not as a
      separate idea: with no shell it cannot write to /tmp, so any file it created
      would land in /workspace and leak into the patch via `git add -N .`.

  - id: fresh-context-verifier
    why: >
      `include_contents: none` gives the verifier a clean context instead of the
      editor's exhausted one, and `{problem_description}` is templated into its
      instruction so it still knows the issue. This directly targets the
      documented compaction problem (threshold 14,336 tokens,
      `event_retention_size` 5): a long trajectory forgets its own reproduction
      output by roughly turn 7. The verifier reads `git diff` from the repository
      rather than recalling what was changed.

      `{problem_description}` is safe to template: it is ALWAYS populated in
      session state. `{hints}` is NOT -- it exists only when `hints_text` is
      non-empty, which is why a bare `{hints}` is a guaranteed KeyError. This
      bundle does not reference it.

expected_delta: >
  PRE-REGISTERED 2026-10-13, before any run.

  v00 holds **8 of 58** tasks. One task is 0.0172 and the SE of a single 58-task
  draw is ~0.045 = 2.6 tasks, so:

  - **6-10 tasks (0.10-0.17) is the NULL band.** Do not read 0.15 as this working.
  - **11+ tasks (0.18+) is evidence** the structural verification helped.
  - **5 or fewer (0.08-) means the budget-starvation risk fired** -- the editor
    ate the budget and the verifier ran inert, or the two-stage topology costs
    more wall clock than it buys. Check the diagnostics named in risks, not the
    prompt.

  Local primary metric remains `gold_hit`, not resolution, because resolution has
  returned 0/12 three times and cannot rank anything at affordable k. **But note
  that `gold_hit` is close to blind to this bundle's mechanism**: a verifier that
  repairs a wrong fix in a file the editor already touched changes `resolved`
  without changing `gold_hit` at all. If v07 is measured locally, read
  `gold_exact`, `patch_bytes` and the verifier's share of charged calls as the
  process check, and accept that only the leaderboard can see the intended effect.

measured:
  clean_n: null
  k: 0
  leaderboard: pending
  submitted: 2026-10-19
  submission_ref: 57390543
  submission_note: >
    Submitted on the 2026-10-19 slot. The rule gating this on v06's score was
    lifted, not broken: v06 returned `COMPLETE` with a BLANK score after six days
    (EXPERIMENTS.md "E013-LB"), so there is no score for v07's to be confounded
    with and the rule lost its referent.

    READING REVISED BY P007. The MANIFEST's null band (6-10 tasks, <=5 means
    budget starvation) was written before wall clock was known to be the binding
    budget. P007 measured v00 timing out on 22 of 60 tasks at a 30-minute cap and
    v06 on 35 of 60 (p=0.0072), with resolution 0.143 among tasks that finish
    against 0.050 overall. v07 adds a second agent pass, so **timeout is now the
    most likely failure mode, ahead of call starvation**, and the worst case is
    v06's: a `COMPLETE` with no score, which would be evidence about v07's speed
    rather than a grader fault. `0.00` still most likely means the grader
    rejected a `SequentialAgent` root -- check that first.
  evidence_from: >
    Not measured. Motivating numbers are first-party: P005 `resolve60_v00` and
    P006 `analyzer_v0{0,5}` (`ledger/runs/*/task_results.jsonl`) -- 11 of 12
    patches produced in both P006 arms, gold_hit 5/12, resolved 0/12, gold_exact
    1/12. Mechanical claims (no callback registry, LoopAgent escalation, session
    state variables, automatic patch recovery) are read from the harness source
    and HARNESS_README 5.1 / 8.1, not from a run.

risks:
  - >
    **BUDGET STARVATION IS THE CENTRAL RISK AND IT IS NOT MITIGATED, ONLY
    ASKED FOR.** The editor and verifier share one 100-call budget. A per-stage
    cap is not expressible. Only prompt text asks the editor to stop early --
    and prompt text not binding is this bundle's own premise, which is
    uncomfortable and is stated rather than hidden. Removing `run_command` bounds
    the *kind* of loop it can enter, not the *number* of calls: T002 observed a
    75x `read_file` loop, which is still available to it.

    **FIRST DIAGNOSTIC TO READ:** the verifier's share of charged calls. If it is
    near zero the stage existed on paper only, and the follow-up is to shrink the
    editor's tool list further, not to rewrite its prompt.

    Bounded downside: if the verifier never runs, the harness's automatic
    unsubmitted-patch recovery still diffs the working tree
    (`HARNESS_README` 8.1), so the editor's edit is banked. The floor is roughly
    "v00 without reproduction", not zero.
  - >
    **The editor cannot reproduce the bug before fixing it.** That is a real
    capability loss and may lower fix quality outright.

    The pre-registered counter-argument: in P005 **2 of 12 tasks produced only a
    reproduction script and no fix**, spending the whole budget proving the bug
    existed. Removing the shell from the editor makes that specific failure mode
    impossible. Whether the loss or the protection dominates is exactly what this
    bundle tests, and the honest position is that the sign is unknown.
  - >
    **Wall clock, which T005 showed is the binding constraint for the sub-agent
    topology.** v00's median wall was 60.4 min with 6 of 12 tasks killed by the
    60-minute cap in P006. Two sequential LLM stages may well be slower than one,
    and if the editor runs long the verifier is cut off by time rather than by
    calls. Record wall clock and cap-terminations for this bundle specifically;
    do not assume the P005 figures apply.
  - >
    **Confounded with v06 by necessity.** The editor holds
    `search_similar_code` and `get_code_neighbors`, which is v06's lever. This is
    forced, not chosen: grep lived inside `run_command`, so removing the shell
    leaves the editor with no text search unless it gets the symbol tools. v07 is
    therefore v06's capability change PLUS the topology change.

    It is readable in sequence rather than in isolation: v06's own leaderboard
    score (submission 57145400) will be known before v07's, so v06 supplies the
    baseline for the graph-tool component. **Do not submit v07 before v06 has
    scored**, or neither is attributable.
  - >
    `SequentialAgent` as the root is untested in this competition by us. Validator
    PASS and zip round-trip PASS are evidence it compiles offline, not that the
    grader accepts it. A 0.00 would most likely mean a topology rejection rather
    than a bad agent -- check for that reading first before concluding anything
    about verification.
