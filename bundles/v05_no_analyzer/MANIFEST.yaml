risks:
  - >
    THE CEILING ON THIS BUNDLE'S UPSIDE, and it was missed when this bundle was
    first written. The 63%-of-budget figure says the analyzer is WASTEFUL. It
    does not say waste is why tasks FAIL, and the same trace set bounds how much
    it could possibly explain: 3 of 12 tasks never called `submit_patch`, which
    means **9 of 12 produced a patch and still resolved nothing**. So budget
    exhaustion accounts for at most a quarter of observed failures, and the other
    three-quarters are patch quality, which this bundle does not touch at all.

    REVISED 2026-10-12 after P005 (EXPERIMENTS.md T002), and the ceiling moves
    up while the warning stands. On a full 100-call budget the no-patch class is
    **5 of 12, not 3**, and all 5 show this bundle's exact mechanism: the
    sub-agent took 90-98% of the charged calls, and in 4 of the 5 the agent
    **never called `write_file` or `edit_file` once** (the fifth tried once after
    exhaustion and was refused). Across all 12 tasks, Spearman(sub-agent share,
    outcome quality) = **-0.90**. So the honest ceiling is ~40% of failures, not
    a quarter -- but it is still a ceiling, 7 of 12 remained unresolvable on
    patch quality alone, and the gradient is observational: heavy analyzer use
    could be a symptom of a hard task rather than its cause.

    Stated plainly because the number is seductive: recovering 657 tool calls
    for a coder that already had enough calls to submit, and still failed, is
    optimising the variable that was cheapest to measure rather than the one that
    moves the metric. The honest expected ceiling is ~+0.03 (3 tasks of 12 scaled
    to a ~60-task private set is ~0.05, and not all of those convert), which is
    inside the leaderboard's noise band.
  - >
    THE MECHANISM MAY RELOCATE RATHER THAN DISAPPEAR -- and this is this bundle's
    own argument turned against it. `rejected_alternative` rejects stripping
    `run_command` because "the loop is not specific to run_command" and would
    migrate to `read_file`. If loops migrate between TOOLS, they can migrate
    between AGENTS. The root coder retains `run_command` and a prompt that
    explicitly tells it to grep, so nothing structurally prevents it from
    reproducing the analyzer's loop in its own context.

    What the evidence does and does not cover: the measured 63%/19-invocation
    split is real, and removing the sub-agent certainly removes THAT consumer.
    Whether total waste falls is NOT established. Therefore the quantity to read
    on this bundle is not resolution and not even gold_hit alone, but the
    **re-issue rate and calls-by-author** from `scripts/analyze_traces.py`: if
    the coder's own re-issue rate rises to absorb the freed budget, the bundle
    has moved the problem and should be retired rather than tuned.
  - >
    THE PRIMARY RISK: this deletes the project's planned paper centrepiece. PLAN.md
    E6 bets on an orchestrator + specialist topology, and this bundle goes the
    opposite way, to a single flat agent. If it wins, E6 is dead and the paper's
    architecture section goes with it. That is an acceptable outcome -- the paper
    chosen this session is about measurement, not architecture (paper/OUTLINE.md
    section 7) -- but it should be a decision, not a surprise.
  - >
    The expected direction is unknown, so this bundle can lose outright. It must
    be measured locally on a rig that resolves before it is ever submitted. One
    submission per day is the scarce resource, not the bundle.
  - >
    Removing the sub-agent also removes the context-isolation benefit it provided:
    the analyzer's search output died with its own context instead of entering the
    coder's. With one flat context, grep spew now lands in the coder's 32,768-token
    window, and ADK compacts at 14,336. So this bundle may trade budget exhaustion
    for context exhaustion. The counter-evidence is that P002's context-window
    deaths were all inside `agent_tool.py`, i.e. in the sub-agent being removed --
    but that is an argument about where the deaths happened, not proof they will
    not reappear in the coder. Read `context_window_deaths` alongside the rest.
  - >
    Single-item ablation against v04_lean, whose own leaderboard reading (0.10)
    did not discriminate anything. The clean comparison is therefore LOCAL and
    paired against v00, not a leaderboard delta against v04.
