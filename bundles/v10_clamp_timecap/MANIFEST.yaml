variant: v10_clamp_timecap
parent: v08_decode_clamp

hypothesis: >
  Two independently measured mechanisms, combined, with nothing else changed.

  1. THE CLAMP (inherited from v08, unchanged). `thinking_budget: 1024` instead
     of v00's 4096. P008, paired, 60 tasks, one session, 30-minute cap:

       timed out   26/60 -> 16/60   (6 gained / 16 lost, McNemar p = 0.0525)
       gold_hit    29/60 -> 40/60   (15 / 4, p = 0.0192)
       gold_exact  11/60 -> 13/60   (9 / 7, p = 0.804)
       resolved     2/60 ->  3/60   (1 / 0, p = 1.000)

     Mechanism confirmed: p99 completion tokens per step 4,132 -> 1,308; steps
     over 2048 tokens 114 -> 11; the MEDIAN step untouched (38 -> 37). The tail
     collapsed rather than everything being truncated, and the agent got ~1,300
     MORE steps out of 11% LESS total decode.

  2. THE CAP (inherited from v09, unchanged file). `eval_config.yaml` with
     `evaluation.max_time_minutes: 30`. Every submission before the 2026-10-12
     19:51:31 wheelhouse republication scored; every one after has returned
     "Notebook Timeout", including a BYTE-IDENTICAL v00 control. T005 measured a
     2.3x slowdown on identical v00 bytes straddling exactly that boundary
     (median task wall 25.9 -> 60.4 min). 30 restores the per-task envelope in
     which the grader demonstrably finished and scored us.

  The two compose rather than merely coexisting: the cap makes unfinished tasks
  fatal, and the clamp is the only measured intervention that converts a timeout
  into a completion. The cap alone (v09) throws away slow tasks; the clamp alone
  (v08) was never submitted into a working channel.

  WHAT THIS BUNDLE IS NOT. It is not justified by a measured RESOLUTION gain.
  v08's resolution effect was 2/60 -> 3/60, ONE task, p = 1.000, and
  `stats.decide` returns UNDERPOWERED on it. This ships on the timeout
  mechanism. Anyone reading a score off this bundle must not read it as
  confirmation that the clamp improves patch quality.

ships_eval_config: true

changes:
  - item: thinking_budget 4096 -> 1024
    inherited_from: v08_decode_clamp
    why: >
      The only intervention in ten bundles that has ever moved an outcome metric.
      Measured in P008; mechanism confirmed independently in T007.
  - item: "eval_config.yaml with evaluation.max_time_minutes: 30"
    inherited_from: v09_timecap
    why: >
      The only candidate fix for 14 days of Notebook Timeout. The file is copied
      byte-for-byte from v09, including its comment block, so the two bundles
      differ by exactly the clamp.

diff_vs_parent: >
  Exactly one added file, `eval_config.yaml`. Every other file is byte-identical
  to v08_decode_clamp. Verify with `diff -r bundles/v08_decode_clamp
  bundles/v10_clamp_timecap` -- expect only MANIFEST.yaml to differ and
  eval_config.yaml to be "only in v10".

pre_registered_readings:
  - condition: scores at or above 0.15 (>= 9/58)
    reading: >
      The channel is restored AND the combination is at least not harmful.
      0.15 is ONE task above v00's 0.13, which is inside the identical-byte
      spread (0.12 / 0.13 / 0.15) and therefore NOT evidence that the clamp
      helped. Do not promote it. Keep the cap in every later bundle.
  - condition: scores 0.13, equal to v00
    reading: >
      The channel is restored and the combination costs nothing. The clamp's
      leaderboard effect is below this instrument's resolution, as expected from
      p = 1.000 on resolution. Keep the cap; stop submitting clamp variants.
  - condition: scores below 0.13 but above 0.00
    reading: >
      The channel is restored and the combination is WORSE than baseline. Most
      likely the 30-minute cap is truncating tasks that would have resolved
      between 30 and 60 minutes. Next move is the cap at 40-45, NOT a new
      topology. Note that v09 (cap without clamp) is the control that separates
      cap cost from clamp cost -- compare against it, not against v00.
  - condition: no score / Notebook Timeout again
    reading: >
      Per-task time is not the binding limit, and this is the SECOND bundle
      carrying the cap to fail. The remaining candidate is the total notebook
      budget including container setup (HARNESS_README section 7.1 excludes
      setup from the AGENT budget, not from notebook wall clock). Escalate,
      reporting the Notebook Timeout status and the 2026-10-12 boundary. Do NOT
      submit a third cap variation.

risks:
  - risk: >
      The cap truncates tasks that would have resolved between 30 and 60 minutes.
    accepted_because: >
      A Notebook Timeout scores NOTHING -- every task is lost, not just the slow
      ones. A lower score that exists beats a perfect one that never reports.
  - risk: >
      v09 and v10 differ by the clamp, but if v09 never scores we have no control
      and v10's score is uninterpretable against the cap.
    mitigation: >
      Do not submit v10 until v09 has reported. The branch is in the plan and in
      v09's own MANIFEST.
  - risk: >
      The validator WARNS that max_time_minutes=30 "throws away part of the
      60-minute budget".
    accepted_because: >
      That warning assumes more time is always better. Under a Notebook Timeout
      the opposite holds: unused budget is what makes the run finish. Left as a
      warning rather than silenced, because it is right in general and wrong
      only while the grader is slow.
  - risk: >
      Inherited from v08 -- identical v00 bytes scored gold_hit 36/60 in P007 and
      29/60 in P008 on the same tasks at the same cap, a 0.117 swing LARGER than
      most of v08's claimed effect.
    accepted_because: >
      Pairing cancels it for the within-session comparison, so P008's result
      stands. But the MAGNITUDE is not trustworthy, and no leaderboard reading of
      this bundle can recover it.
