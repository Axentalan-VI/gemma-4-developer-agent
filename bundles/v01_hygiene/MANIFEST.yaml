variant: v01_hygiene
parent: v00_public_baseline
hypothesis: >
  Eliminate waste rather than add capability. Each change below is motivated by
  a documented harness mechanic or a measured property of the gold patches, not
  by a hunch, and none is individually large enough to measure on free-tier
  compute. Tested as one bundle against the k=4 reference.
topology: unchanged from v00 (root coder + read-only code_analyzer AgentTool)
ships_eval_config: false
expected_delta: +0.02 to +0.05
measured:
  clean_n: null            # GPU blocked: no L4x4 allocation since 2026-10-05
  k: 0
  leaderboard: pending     # submitted 2026-10-06, ref 56875884
  submitted_without_local_measurement: true
  # Deliberate deviation from the ship rule in stats.py, which requires a
  # significant local delta first. Justified only because the local loop is
  # hardware-blocked and the leaderboard is the one channel still open. Read the
  # result with the noise floor in mind: +/-1 task = 0.017, so anything short of
  # ~0.06 against v00's 0.13 is not evidence either way.

changes:
  - id: py-compile-after-edit
    why: >
      edit_file's whitespace-flexible tier can apply a change at the wrong
      indentation and leave a file that still parses as far as the tool is
      concerned but breaks on import. In Python that is a guaranteed zero, and
      one free tool call catches it. Highest-value single instruction here.
  - id: scratch-to-tmp-via-heredoc
    why: >
      The patch is `git add -N . && git diff`, so a leftover /workspace/repro.py
      ships. write_file rejects /tmp, so the only route is a run_command
      heredoc, which the v00 prompt never explains.
  - id: never-revert
    why: >
      The harness auto-extracts the working tree even without submit_patch, so
      an agent that concludes its fix was wrong and checks out the file
      guarantees an empty diff. v00 says nothing about this. Adds an explicit
      /tmp/best.patch save-and-restore protocol instead.
  - id: correct-patch-never-adds-a-file
    why: >
      Measured: 0 of 129 gold patches create a new file (scripts/analyze_tasks.py).
      So this is an exact rule, not a heuristic, and it can be stated flatly.
  - id: fix-search-similar-code-usage
    why: >
      v00's analyzer prompt says to use search_similar_code "for concepts the
      issue describes without naming code" -- precisely the usage that cannot
      work, because it resolves the query against stored symbol keys rather than
      embedding free text. It also returns full node source, so a broad call can
      flood a 32k context. Now: bare symbol names only, k<=3, verify by reading.
      This looks like a latent bug in the bundle ~19 teams are running.
  - id: read-file-over-sed
    why: >
      v00 offers `sed -n 'START,ENDp'` as an equal alternative to read_file, but
      run_command output truncates at 5,000 chars against read_file's 10,000, so
      sed is strictly worse for reading code.
  - id: git-grep-over-grep-r
    why: Faster in a git checkout, and ripgrep is not installed.
  - id: async-blind-graph-tools
    why: >
      Graph tools carry synchronous CALLS edges only and miss async functions
      entirely, which is most of fastapi and httpx. The prompt now says a
      missing node proves nothing, and not to pass edge_type.
  - id: budget-framing
    why: >
      Competitors report 8-10 turn workflows against a 100-call, 60-minute
      budget. v00's prompt reads as if budget were scarce. Reframed to say the
      surplus exists and belongs to verification and repair.
  - id: separate-analyzer-sampling
    why: >
      v00 shares one sampling config between coder and analyzer. The analyzer
      emits a fixed 250-word report, so 8192 output tokens is dead weight;
      3072 at temperature 0.1 suits a deterministic extraction task.
  - id: terse-issue-handling
    why: >
      Measured: rich's problem statements have a median of 146 chars against
      fastapi's 677. Identifier-extraction rules degrade badly on terse issues,
      and rich is the confirm split. The analyzer is now told what to do when an
      issue names no code, instead of inventing detail.

risks:
  - >
    The one prompt-level A/B in the community corpus claims short and generic
    beats long and rule-laden: a competitor's long lab-derived ruleset scored
    0.05 against the short public prompt's 0.12-0.15. This bundle is longer than
    v00, so it is exposed to exactly that failure. The mitigation is that every
    rule here is about the harness or about measured gold-patch structure, and
    none is about a specific library -- which is what the validator's
    generalization lint enforces. If this bundle regresses, the next one tests
    the same items as a *shorter* prompt rather than abandoning them.
  - >
    Raising max_output_tokens to 12288 with thinking_budget 2048 leaves 18k of
    the 32k window for prompt plus history. Watch the compaction rate in traces.
