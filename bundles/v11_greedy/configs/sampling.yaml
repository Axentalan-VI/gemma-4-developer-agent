# SINGLE KNOB vs v10_clamp_timecap: temperature 0.2 -> 0.0 (greedy decode).
# Every other file in this bundle is byte-identical to v10, and the only line
# of YAML that differs is the `temperature:` line below. This header is the
# only other edit, because v10's header asserted "everything else is
# byte-identical to v00", which is false here -- v11 carries v10's clamp AND
# v10's eval_config.yaml on top of the decode change.
#
# WHY GREEDY (the hypothesis; full version in MANIFEST.yaml). Ten bundles have
# shipped `temperature: 0.2 / top_p: 0.95 / top_k: 40`, byte-identical, and all
# nine attempts to beat the published baseline moved navigation, budget,
# topology or thinking_budget instead. Decode sampling is the one knob class
# never varied. A diff has no error tolerance: one plausible-but-wrong
# identifier sampled inside a hunk and the patch either applies and fails its
# test or fails to apply at all. Greedy decode removes that sampling variance
# from exactly the output where it is least survivable.
#
# WHAT THE VALIDATOR SAYS, and why it is left as a warning rather than silenced:
# `_check_sampling` WARNS that temperature 0 "can trap the agent re-issuing one
# failing edit forever; because it keeps calling tools the 3-nudge rule never
# fires and the budget drains". That warning is the central risk of this bundle,
# not a nuisance -- this project has measured loop pathologies before (reissue
# rate +0.151 when a budget was freed; 174 `submit_patch` calls in one task).
# So the run reports reissue/loop rate as a guard-rail reading. See MANIFEST.
#
# `top_p` and `top_k` are deliberately NOT touched. At temperature 0 both are
# inert under vLLM's greedy path, and removing them would be a second edit with
# no behavioural effect -- which is how a one-knob experiment stops being one.
#
# ---- the inherited clamp comment follows, unchanged from v10 ----
#
# SINGLE KNOB vs v00 (as of v08/v10): thinking_budget 4096 -> 1024.
#
# Why this knob and this value (T007, 2026-10-19, EXPERIMENTS.md):
#
# Per-step latency is set by DECODE, essentially alone. Pooled over P007's 120
# task-runs, corr(completion tokens per step, seconds per step) = +0.968, while
# the same correlation for PROMPT tokens is negative (-0.44). Tasks that time out
# generate 712 completion tokens per step at 50.6 s/step; tasks that finish
# generate 212 at 16.5 s/step, with near-identical prompt sizes. And verbosity
# buys nothing: across verbosity quartiles time rises 10.6 -> 58.4 s/step while
# gold_hit FALLS 10/15 -> 7/15.
#
# The per-step distribution over 8,422 observed agent steps is extremely skewed:
#   p50 = 40 tokens, p75 = 186, p90 = 625, p95 = 1,199, p99 = 4,123, max = 8,192.
# So a small minority of steps carries most of the decode. Clamping at 1024
# touches only 6.1% of steps yet removes ~29.6% of all decode (upper bound,
# assuming the clamp truncates rather than redistributing).
#
# 512 would remove ~46% but truncates 12% of steps, and 256 touches 20%. Those
# were rejected: v01's sampling comment records that hitting the output cap
# mid-tool-call leaves an unclosed call and burns the turn, so aggressive
# clamping risks trading timeouts for malformed calls.
#
# thinking_budget is deliberately the knob rather than max_output_tokens, for two
# reasons. (1) It bounds RUMINATION only and cannot truncate a tool call, so it
# avoids the failure mode above. (2) max_output_tokens is a RESERVATION -- the
# input ceiling is 32768 minus it -- so moving it would also change the context
# budget, making this two changes instead of one.
#
# Caveat, stated because T007 does not license more: the TIMING half is
# mechanical (tokens cost seconds). That verbosity does not HELP is established;
# that clamping it is FREE is not. This run is what tests that.
temperature: 0.0
top_p: 0.95
top_k: 40
max_output_tokens: 8192
thinking_config:
  thinking_budget: 1024
  include_thoughts: false
