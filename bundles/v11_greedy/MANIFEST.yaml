variant: v11_greedy
parent: v10_clamp_timecap

hypothesis: >
  GREEDY DECODE FOR PATCH GENERATION. `temperature: 0.2 -> 0.0`. That is the
  only semantic change; see `diff_vs_parent`.

  WHY THIS KNOB, AND WHY NOW. Nine bundles have failed to beat the competition's
  own published baseline, and every one of them moved navigation, budget,
  topology or `thinking_budget`. `temperature: 0.2 / top_p: 0.95 / top_k: 40` is
  BYTE-IDENTICAL in all ten bundles built so far (verified 2026-10-21). Decode
  sampling is the one knob class this project has never varied once. It is also
  one schema-legal line: `temperature` is in `GENERATION_PARAM_FIELDS`
  (`reference/harness_facts/source/adk_submission__limits.py:227-239`), unlike
  `candidate_count`, which is absent and would be rejected by `extra="forbid"`.

  THE MECHANISM, stated so it can be wrong. The agent's output is consumed in
  two very different ways, and they have very different error tolerance.

    - PROSE AND PLANNING tolerate a suboptimal token. A slightly worse sentence
      of reasoning still leads somewhere.
    - A DIFF DOES NOT. `edit_file` and `write_file` arguments must name an
      existing identifier, reproduce surrounding context exactly, and keep the
      hunk internally consistent. One plausible-but-wrong token -- a sibling
      attribute, a near-miss keyword argument, an off-by-one line of context --
      and the edit either fails to apply or applies and fails its test. There is
      no partial credit: `resolved` is binary per task.

  At temperature 0.2 with `top_p: 0.95` and `top_k: 40` the model samples from a
  truncated distribution on EVERY token, including the tokens inside a hunk.
  Greedy decode takes the argmax instead, so the sampling variance is removed
  from exactly the output where it is least survivable. The claim is NOT that
  greedy makes the model smarter; it is that 0.2 is spending variance in a place
  that cannot absorb it.

  WHAT WOULD MAKE THIS WRONG, and it is a real possibility rather than a
  formality. Sampling is also what lets a stuck agent try something different on
  the next attempt. Greedy decode is deterministic given the context, so an
  agent that re-reads the same file and re-issues the same failing edit can get
  the SAME tokens back, and the loop is only broken by the context changing.
  This project has measured exactly that class of pathology -- see `risks`. The
  validator warns about it by name.

  NOTE WHAT THIS IS NOT. vLLM is not bitwise deterministic under continuous
  batching, so `temperature: 0.0` does NOT make a run reproducible. It changes
  the token-selection rule, not the engine's numerics. Do not report this bundle
  as "the deterministic one".

topology: >
  Identical to v10_clamp_timecap, and therefore to v08 and v00. Root `swe_coder`
  (6 tools) plus the read-only `code_analyzer` AgentTool. Nothing about the agent
  graph, the prompts or the tool set changes.

ships_eval_config: true

changes:
  - item: "configs/sampling.yaml: temperature 0.2 -> 0.0"
    why: >
      The only semantic change. The one knob class never varied in ten bundles,
      and the one whose failure mode (a wrong token inside a diff) is binary
      rather than graded.
  - item: "configs/sampling.yaml: comment header rewritten"
    why: >
      NOT a behavioural change -- YAML comments never reach the model. It is
      listed because it changes `bundle_hash`, and because v10's header asserted
      "Everything else in this bundle is byte-identical to v00_public_baseline",
      which is false here. A stale comment that contradicts the bundle is worse
      than no comment. The inherited clamp rationale is preserved verbatim below
      the new block.
  - item: "thinking_budget: 1024 -- INHERITED, unchanged"
    inherited_from: v08_decode_clamp
    why: >
      Held constant on purpose. Moving it would make this two changes and the
      result uninterpretable.
  - item: "eval_config.yaml (max_time_minutes: 30) -- INHERITED, byte-identical"
    inherited_from: v09_timecap
    why: >
      Held constant so the control and the treatment share the submission
      channel's time envelope. `ships_eval_config: true` is declared, and
      `build.py` now RAISES if the build flag is missing, because a v10 dry-run
      without it packaged v08's exact hash (26354b2d0153378d) under v10's name.

diff_vs_parent: >
  `diff -r bundles/v10_clamp_timecap bundles/v11_greedy` reports exactly two
  differing files: MANIFEST.yaml (lab metadata, never shipped) and
  configs/sampling.yaml. Inside sampling.yaml exactly one non-comment line
  differs: `temperature: 0.2` -> `temperature: 0.0`. `agent.yaml`,
  `eval_config.yaml`, `prompts/system.md`, `prompts/analyzer.md` and
  `sub_agents/code_analyzer.yaml` are byte-identical.

  Verify with:
    diff -r bundles/v10_clamp_timecap bundles/v11_greedy
    diff <(grep -v '^#' bundles/v10_clamp_timecap/configs/sampling.yaml) \
         <(grep -v '^#' bundles/v11_greedy/configs/sampling.yaml)

measured:
  clean_n: null
  k: 0
  leaderboard: null
  evidence_from: >
    NOT MEASURED. This MANIFEST is written before any result exists, which is
    the point of the pre-registered readings below. The motivating facts are
    first-party: the byte-identity of the sampling block across all ten bundles,
    and the loop-pathology figures in `risks` from P002/P007 traces. No number
    here comes from a gold patch or from the leaderboard.

measurement_design: >
  PRE-REGISTERED, 2026-10-21, before the run. `kernels/18_decode_ab`.

    arms          v10_clamp_timecap (control, temperature 0.2)
                  v11_greedy        (treatment, temperature 0.0)
    tasks         clean_dev.txt, 60 fastapi tasks (all inside clean_n)
    cap           max_time_minutes 30 -- the bundles' OWN eval_config value
    calls         max_tool_calls 100 -- the grader's
    concurrency   12
    session       ONE. Arms are never paired across sessions: identical v00
                  bytes read gold_hit 36/60 and 29/60 in two sessions, and a
                  cross-session pairing once read +0.167 where truth was 0.000.

  PRIMARY METRIC IS `resolved`, and nothing else authorises a ship.

  `gold_hit` IS DEMOTED TO A DESCRIPTIVE COLUMN AND MUST NOT RANK THIS BUNDLE.
  It is retired as a ranking metric: same-byte sessions swung it 0.117, larger
  than the effect it was being used to detect. It is still reported, because it
  is free and because a large move in it is worth knowing about -- but a
  `gold_hit` gain is NOT a reason to ship v11 and a `gold_hit` loss is NOT a
  reason to kill it.

  POWER, STATED BEFORE THE RUN AND UNFLATTERING. `se_unit` is ~0.030 on 129
  tasks, so ~0.044 on 60, and `detectable_delta` at k=1 per arm is **0.093** --
  about 6 of 60 tasks. Against a design target of 0.05 (PLAN.md),
  `stats.is_underpowered` will return True, so `stats.decide` can only return
  UNDERPOWERED or a result large enough to be implausible. Worse, the paired
  base rate is the real problem, not n: P007 saw resolved 3/60 vs 3/60 with
  ZERO discordant pairs. A single session cannot afford k=2 at this shape (two
  passes is ~11.6 h wall, past the 9-12 h session cap), and k=2 on 36 tasks
  detects 0.085 -- no better, for more quota.

  So this is said plainly: NO AFFORDABLE LOCAL DESIGN CAN ADJUDICATE `resolved`
  AT THIS BASE RATE. The run is worth its quota for what it CAN read -- the
  guard-rail readings below, which are where greedy decode would do its damage
  -- and UNDERPOWERED on resolution is a pre-registered outcome here, not a
  surprise. If that is the outcome, the next allocation buys k, not a bundle.

pre_registered_readings:
  - condition: >
      resolved UP with a significant paired delta (stats.decide returns SHIP)
    reading: >
      Greedy decode is the first intervention in eleven bundles to move the ship
      metric. Submit v11, keep temperature 0.0 in every later bundle, and treat
      the decode class as the live direction. Given the power stated above this
      outcome requires a LARGE effect; check the discordant-pair count by hand
      before believing it, and check that both arms ran the same 60 tasks.
  - condition: >
      resolved flat, and stats.decide returns UNDERPOWERED
    reading: >
      THE EXPECTED OUTCOME, pre-registered as such. The decode knob is not
      refuted -- it was not measured. Do NOT record this as HOLD and do NOT read
      it as "greedy does not help": those are the two errors this project has
      already made (P002 was logged as HOLD and is really UNDERPOWERED). The
      decision then rests on the guard-rail readings: if reissue/loop rate is
      FLAT OR DOWN and timeouts are flat or down, greedy is free, and a free
      change to the one untried knob class is worth one submission slot. If the
      guard-rails moved the wrong way, see the next row.
  - condition: >
      reissue/loop rate UP materially (>= +0.10 paired, or any task with a
      pathological repeat count in the v11 arm that has no counterpart in v10)
    reading: >
      THE READING THAT FALSIFIES THE KNOB. Greedy decode has locked the agent
      into repeating a failing action, exactly as the validator warns and as
      this project has measured when a budget was freed. Kill the bundle; do not
      retune temperature to 0.1 hoping to split the difference, because the
      mechanism being refuted is determinism per se, not the size of 0.2. The
      salvage direction, if any, is a prompt-level loop breaker -- a DIFFERENT
      bundle, and one that must be designed against the fact that re-shipping
      the verify gate has already scored 0.08.
  - condition: >
      resolved DOWN with a significant paired delta
    reading: >
      Sampling was load-bearing: the 0.2 jitter was buying escape from local
      minima more than it was costing wrong tokens in diffs. Kill the bundle and
      record that the decode class is tested and negative -- which is itself
      worth the quota, because it removes the last untried knob class and
      strengthens the hypothesis that the baseline sits at the W4A16 31B's
      quality ceiling.
  - condition: >
      timeouts UP in the v11 arm
    reading: >
      Unexpected and mechanically interesting: greedy decode changes which
      tokens are produced, not how many, so a timeout rise most likely means
      longer argmax continuations or more retry loops. Read it together with the
      reissue rate -- if both rose, it is the loop pathology, not decode length.
      Either way the clamp's timeout gain (P008, 26/60 -> 16/60) is being spent,
      and that is a cost v11 has to beat with resolution to be worth shipping.
  - condition: >
      an arm returns zero rows, or the two arms ran different task sets
    reading: >
      NOT A RESULT. Count the rows before reading anything: expect 120 (60 tasks
      x 2 arms). P009 v1 returned 0 rows and still reported COMPLETE. Recover
      from the `=== COPY FROM HERE ===` block with
      `scripts/recover_from_log.py --write` and re-run the missing arm; do not
      pair a partial arm against a full one, and never against another session.

risks:
  - risk: >
      GREEDY LOCKS THE AGENT INTO A REPEATED FAILING ACTION. This is the central
      risk, not a caveat, and the validator names it: `_check_sampling` WARNS
      that "temperature 0 can trap the agent re-issuing one failing edit
      forever; because it keeps calling tools the 3-nudge rule never fires and
      the budget drains". The pathology is MEASURED here, not hypothetical:
      `reissue_rate` rose +0.151 when a budget was freed, one task issued 174
      `submit_patch` calls, and another issued 136 malformed `edit_file` calls.
      Determinism removes the mechanism that would have perturbed the retry.
    mitigation: >
      THE RUN MUST REPORT REISSUE/LOOP RATE AS A GUARD-RAIL READING, paired per
      task, alongside resolved. `scripts/analyze_traces.py` computes
      `reissue_rate` (repeat-argument calls / counted calls) and
      `coder_call_share`; `kernels/18_decode_ab` prints both per arm into the
      LOG, not only into the results zip, because the traces do not always
      survive the trip home and the guard-rail is useless if it arrives only
      when the run went well. A material rise is a pre-registered kill, above.
    accepted_because: >
      The warning is left as a warning rather than silenced. It is right in
      general; whether it binds here is the experiment.
  - risk: >
      `top_p: 0.95` and `top_k: 40` are left in place while temperature is 0.
    accepted_because: >
      At temperature 0 both are inert on vLLM's greedy path, so removing them
      would change bytes without changing behaviour -- a second edit with no
      mechanism, which is how a one-knob experiment stops being one. If a future
      harness version makes them interact with greedy decode, that is a NEW
      bundle, and this line is the record that it was considered.
  - risk: >
      Inherited from v10: the 30-minute cap truncates tasks that would have
      resolved between 30 and 60 minutes.
    accepted_because: >
      Both arms share the cap and the comparison is paired per task, so it
      cannot favour either arm. The cap is also the bundles' own shipped
      `eval_config` value, so measuring at 30 measures what would ship.
  - risk: >
      Inherited from v10/v08: identical v00 bytes scored gold_hit 36/60 and
      29/60 on the same tasks at the same cap -- a 0.117 session swing.
    accepted_because: >
      Pairing inside one session cancels it for the within-session delta. It is
      also the whole reason `gold_hit` is demoted here rather than merely
      deprioritised.
  - risk: >
      v11 is a submission candidate, and v10 is still PENDING on the
      leaderboard. If v10 never scores, a v11 leaderboard number has no control.
    mitigation: >
      Local measurement first, in `kernels/18_decode_ab`. Do not spend a
      submission slot on v11 before v10's branch resolves -- the same gate
      v10's own MANIFEST put on v09.
  - risk: >
      Reading this run's `gold_hit` as the result, because it is the metric that
      has historically moved.
    mitigation: >
      Stated in `measurement_design` and repeated in the kernel's first markdown
      cell. `stats.decide` keys on `resolved` and nothing else.

notes: >
  This is a deliberate single-knob experiment, which this project's CLAUDE.md
  normally forbids on cost grounds (one prompt tweak moves less than the
  detectable delta, so single-knob runs burn quota to produce noise). The
  exception is justified on the same grounds as v08's: the knob is not prompt
  text, the mechanism is specific and falsifiable, and grouping it with other
  changes would make a flat result uninterpretable -- which matters more than
  usual here, because an UNDERPOWERED verdict on resolution is the pre-registered
  expectation and the guard-rail readings are what the run is really buying.

  Built, validated and zipped 2026-10-21. NOT pushed, NOT run, NOT submitted:
  two Kaggle batch GPU sessions were in flight and the cap is 2.
